spring:
  datasource:
    url: jdbc:h2:file:~/atlexdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# JWT 서명 키. 운영에서는 JWT_SECRET 환경변수로 주입 (아래 임시값은 로컬 개발용)
jwt:
  secret: ${JWT_SECRET:djksdjl23423213njn23jdsadnakjfnej_atlex_2026}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

# 그래프 키워드 가중치와 관계 계산 기준. 값을 바꾸면 이후 인덱싱부터 반영된다.
graph:
  weight:
    # 필드별 등장 횟수에 곱하는 배수
    title: ${GRAPH_WEIGHT_TITLE:1.5}
    content: ${GRAPH_WEIGHT_CONTENT:1.0}
    tag: ${GRAPH_WEIGHT_TAG:2.0}
  relation:
    # 관계 계산에 사용할 소스 글의 상위 키워드 수
    max-source-keywords: ${GRAPH_MAX_SOURCE_KEYWORDS:8}
    # 키워드를 공유하는 후보 글 조회 상한
    max-candidates: ${GRAPH_MAX_CANDIDATES:50}
    # 글 하나가 가질 수 있는 최대 연결 수
    max-per-post: ${GRAPH_MAX_RELATIONS_PER_POST:5}
    # 관계로 저장·조회할 최소 연관도. 인덱싱과 조회가 같은 값을 쓴다.
    min-score: ${GRAPH_MIN_SCORE:0.15}

# GitHub 연동 설정
github:
  client-id: ${GITHUB_CLIENT_ID:}
  client-secret: ${GITHUB_CLIENT_SECRET:}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/blog_option}
  encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY}


---
# 운영(EC2 + RDS MySQL) 프로파일: SPRING_PROFILES_ACTIVE=prod
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:atlex}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 데이터 휘발 방지 — 엔티티 기준으로 스키마를 유지/갱신 (create 금지)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # 기존 schema.sql(DROP TABLE)이 매 부팅 데이터를 지우지 않도록 비활성화
  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false
