spring:
  datasource:
    url: jdbc:h2:file:~/atlexdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# JWT 서명 키. 운영에서는 JWT_SECRET 환경변수로 주입 (아래 임시값은 로컬 개발용)
jwt:
  secret: ${JWT_SECRET:djksdjl23423213njn23jdsadnakjfnej_atlex_2026}

---
# 운영(EC2 + RDS MySQL) 프로파일: SPRING_PROFILES_ACTIVE=prod
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:atlex}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 데이터 휘발 방지 — 엔티티 기준으로 스키마를 유지/갱신 (create 금지)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # 기존 schema.sql(DROP TABLE)이 매 부팅 데이터를 지우지 않도록 비활성화
  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false
