upstream atlex_app {
    server app:8080;
}

# Host 헤더가 없는/비정상 요청(봇·스캐너)에서 $host 가 catch-all 'server_name _' 로
# 떨어져 백엔드에 'Host: _' 가 전달되면 Tomcat 11이 거부(IllegalArgumentException)한다.
# '_' 만 유효한 값(invalid-host)으로 치환해 노이즈 로그를 제거한다. 정상 요청은 그대로 통과.
# localhost 대신 권한 없는 더미 도메인을 써서 백엔드가 localhost를 내부 신뢰 요청으로
# 취급할 경우의 우회(Host Header Injection) 가능성을 차단한다.
map $host $safe_host {
    default  $host;
    "_"      "invalid-host";
}

# ---------------------------------------------------------------------------
# 1단계: 도메인 연결 전 — HTTP(80)로 바로 프록시 (지금은 이 블록만 동작)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # certbot(Let's Encrypt) 인증서 발급용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://atlex_app;
        proxy_set_header Host              $safe_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
