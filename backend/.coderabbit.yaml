# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!build/**"
    - "!**/generated/**"
  path_instructions:
    - path: "src/main/java/**/controller/**"
      instructions: |
        - 인증/인가 누락 여부를 우선 확인하세요.
        - 요청 검증과 에러 응답 형식이 기존 ApiResponse/ErrorCode 패턴을 따르는지 확인하세요.
    - path: "src/main/java/**/service/**"
      instructions: |
        - 트랜잭션 경계가 적절한지 확인하세요.
        - N+1 쿼리, 반복 쿼리, 불필요한 전체 조회를 지적하세요.
        - 도메인 책임이 과하게 섞였는지 확인하세요.
    - path: "src/main/java/**/repository/**"
      instructions: |
        - JPQL의 named parameter, fetch join, bulk update/delete 사용이 안전한지 확인하세요.
        - 복잡한 동적 조건은 QueryDSL 전환 후보로 제안하세요.
    - path: "src/test/java/**"
      instructions: |
        - 테스트 이름이 행위를 설명하는지 확인하세요.
        - 인증/권한/비공개 리소스/예외 케이스가 누락됐는지 확인하세요.

chat:
  auto_reply: true
