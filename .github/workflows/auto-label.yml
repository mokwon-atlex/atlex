name: Validate PR Title and AutoLabel

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate-title-and-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Validate PR title and apply label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # This job intentionally uses GitHub's API only. Never check out or
          # execute files from the pull request, including fork pull requests.
          TYPE=$(printf '%s\n' "$PR_TITLE" | sed -nE \
            's/^\[(feat|fix|refactor|test|docs|ci|chore)\][[:space:]]+.+$/\1/p')

          if [ -z "$TYPE" ]; then
            echo "PR 제목은 '[타입] 작업 제목' 형식이어야 합니다." >&2
            echo "지원 타입: feat, fix, refactor, test, docs, ci, chore" >&2
            exit 1
          fi

          if ! EXISTING_LABELS=$(gh label list \
            --repo "$REPO" \
            --limit 1000 \
            --json name \
            --jq '.[].name'); then
            echo "Failed to retrieve repository labels" >&2
            exit 1
          fi

          if ! grep -Fqx "$TYPE" <<< "$EXISTING_LABELS"; then
            gh label create "$TYPE" \
                --repo "$REPO" \
                --color "#1d76db" \
                --description "PR type: $TYPE" \
                --force
          fi

          if ! CURRENT_LABELS=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json labels \
            --jq '.labels[].name'); then
            echo "Failed to retrieve pull request labels" >&2
            exit 1
          fi

          for LABEL in feat fix refactor test docs ci chore; do
            if [ "$LABEL" != "$TYPE" ] && grep -Fqx "$LABEL" <<< "$CURRENT_LABELS"; then
              gh pr edit "$PR_NUMBER" \
                --repo "$REPO" \
                --remove-label "$LABEL"
            fi
          done

          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-label "$TYPE"
