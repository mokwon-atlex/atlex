name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# 배포 작업 직렬화 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atlex

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # OCI Always Free VM.Standard.E2.1.Micro(x86_64) 기준
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          TARGET_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.OCI_USER || secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY || secrets.EC2_SSH_KEY }}
          envs: TARGET_SHA,GHCR_USER,GHCR_TOKEN
          command_timeout: 30m
          script: |
            set -e
            cd ~/atlex
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            # 비공개 GHCR 패키지 pull 대비 로그인
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # 배포 대상 커밋 SHA 태그 이미지로 실행
            export IMAGE_TAG="$TARGET_SHA"
            docker compose -f backend/docker-compose.yml pull
            docker compose -f backend/docker-compose.yml up -d

            # 헬스 체크 (최대 5분, 저사양 서버의 느린 기동 고려)
            HEALTHY=0
            for i in $(seq 1 60); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/v1/health || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "헬스 체크 성공 (시도 $i)"
                HEALTHY=1
                break
              fi
              echo "헬스 체크 대기 $i/60 (HTTP $HTTP_CODE)"
              sleep 5
            done

            docker logout ghcr.io

            if [ "$HEALTHY" -ne 1 ]; then
              echo "헬스 체크 실패: 최근 app 로그"
              docker compose -f backend/docker-compose.yml logs --tail=100 app
              exit 1
            fi

            docker image prune -f
