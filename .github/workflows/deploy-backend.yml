name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atlex

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify latest main commit
        run: |
          LATEST_SHA=$(git ls-remote https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git refs/heads/main | awk '{print $1}')
          echo "Target commit SHA: ${{ github.sha }}"
          echo "Latest main SHA:   $LATEST_SHA"
          if [ "${{ github.sha }}" != "$LATEST_SHA" ]; then
            echo "::error::현재 배포 대상 커밋(${{ github.sha }})이 원격 main의 최신 커밋($LATEST_SHA)과 일치하지 않습니다. 이전 커밋 배포를 차단합니다."
            exit 1
          fi
      - name: Deploy to EC2 and verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/atlex
            TARGET_SHA="${{ github.sha }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            PULLED_SHA=$(git rev-parse HEAD)
            echo "Current EC2 main commit: $PULLED_SHA"
            if [ "$PULLED_SHA" != "$TARGET_SHA" ]; then
              echo "Error: EC2 pulled commit ($PULLED_SHA) does not match deployment target commit ($TARGET_SHA)."
              exit 1
            fi

            echo "Deploying container with image tag: $TARGET_SHA"
            IMAGE_TAG=$TARGET_SHA docker compose -f backend/docker-compose.yml pull
            IMAGE_TAG=$TARGET_SHA docker compose -f backend/docker-compose.yml up -d

            echo "Waiting for application to become healthy..."
            MAX_RETRIES=30
            RETRY_INTERVAL=3
            HEALTHY=0
            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/v1/health || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed on attempt $i (HTTP 200)."
                HEALTHY=1
                break
              fi
              echo "Attempt $i/$MAX_RETRIES: HTTP code $HTTP_CODE, retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            done

            if [ $HEALTHY -ne 1 ]; then
              echo "Error: Application health check failed after $MAX_RETRIES attempts."
              echo "=== Recent app container logs ==="
              docker compose -f backend/docker-compose.yml logs --tail=100 app
              exit 1
            fi

            echo "Health check successful. Cleaning up unused images..."
            docker image prune -f
