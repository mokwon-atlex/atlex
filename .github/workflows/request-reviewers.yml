name: Request Team Reviewers

on:
  pull_request_target:
    types: [ready_for_review]

jobs:
  request-reviewers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted automation code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Request reviews from all team members
        uses: actions/github-script@v9
        with:
          script: |
            const automation = require("./.github/scripts/request-reviewers.cjs");
            await automation.run({ github, context, core });
