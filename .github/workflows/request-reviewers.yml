name: Ready for Review

on:
  pull_request_target:
    types: [ready_for_review]

jobs:
  request-reviewers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted automation code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Request reviews from all team members
        uses: actions/github-script@v9
        with:
          script: |
            const automation = require("./.github/scripts/request-reviewers.cjs");
            await automation.run({ github, context, core });

      - name: Notify Discord
        uses: actions/github-script@v9
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const notification = require("./.github/scripts/discord-ready-notification.cjs");
            await notification.sendReadyNotification({
              webhookUrl: process.env.DISCORD_WEBHOOK_URL,
              pullRequest: context.payload.pull_request,
              fetchImpl: globalThis.fetch,
              core,
            });
